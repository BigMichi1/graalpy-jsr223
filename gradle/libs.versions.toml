[versions]
graalpy = "25.4.4.1.1"
cibseven = "2.2.0"
junit = "6.1.3"
assertj = "3.27.7"
h2 = "2.5.252"
slf4j = "2.0.17"
jmh = "1.37"
jacoco = "0.8.15"

[libraries]
graalpy-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graalpy" }
graalpy-python = { module = "org.graalvm.polyglot:python-community", version.ref = "graalpy" }
cibseven-engine = { module = "org.cibseven.bpm:cibseven-engine", version.ref = "cibseven" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
